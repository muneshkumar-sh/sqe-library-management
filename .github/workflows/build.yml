name: Build and SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          pip install --only-binary :all: pytest==7.4.4 pytest-cov==4.1.0
          # Fix for the "Omitting --only-binary" issue: we force binary wheels
          # Fix for the "locking resolved versions" issue: we pin exact versions
          pip install --only-binary :all: pytest==7.4.4 pytest-cov==4.1.0

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@02b43c4b43e7b05821f6c392eb72f566f3c6e478 # v2.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}