sonar.projectKey=muneshkumar-sh_sqe-library-management
sonar.organization=muneshkumar-sh

# Tell SonarCloud where the source code and tests are
sonar.sources=src
sonar.tests=tests

# Tell SonarCloud to read the coverage report generated by pytest
sonar.python.coverage.reportPaths=coverage.xml

# Exclude the GitHub workflows folder so it stops complaining about YAML files
sonar.exclusions=.github/**/*